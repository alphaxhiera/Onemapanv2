# OneMapan — Docker Compose deployment
#
# Usage (on the VPS, from the repository root):
#   cp .env.example .env      # then edit values
#   docker compose up -d --build
#
# All variables below are read from the .env file next to this compose file.
# Never commit that file.

# Fixed project name so container/volume names are always onemapan_*.
name: onemapan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Only reachable from this server, and only for your own admin tooling.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "2025"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SERVER_BASE_URL: ${SERVER_BASE_URL:?SERVER_BASE_URL is required in .env (public base URL, no trailing slash)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-5242880}
    volumes:
      - uploads:/app/public/uploads
    # Bound to loopback: only Nginx on this machine can reach it.
    ports:
      - "127.0.0.1:2025:2025"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:2025}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
  uploads:
